# Roda a cada 30 minutos e tambem pode ser disparado manualmente.
# Obs: o cron do GitHub Actions costuma atrasar (minutos a horas).
name: dog-alerta

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Monitor DOG (volume + transferencias)
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set +e
          python3 dog_alerta.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Salvar state.json (evita alertas repetidos)
        if: always()
        run: |
          git config user.name "dog-alerta[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && echo "state sem mudanca" && exit 0
          git commit -m "chore: atualiza state.json [skip ci]"
          git push

      - name: Falhar o job se houve alerta (e-mail do GitHub)
        if: steps.run.outputs.code == '1'
        run: exit 1
