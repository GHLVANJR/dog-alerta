# Roda a cada 30 minutos e tambem pode ser disparado manualmente.
# Obs: o cron do GitHub Actions costuma atrasar (minutos a horas).
name: dog-alerta

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dog-alerta
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Monitor DOG (volume, transferencias, preco, entrada, on-chain)
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python3 -u dog_alerta.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # codigo != 0 e != 1 (ex.: crash) nao e alerta; vira so aviso
          if [ "$code" != "0" ] && [ "$code" != "1" ]; then
            echo "::warning title=DOG script falhou::dog_alerta.py saiu com codigo $code (nao e alerta)"
          fi

      - name: Salvar state.json (evita alertas repetidos)
        if: always()
        run: |
          git config user.name "dog-alerta[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && echo "state sem mudanca" && exit 0
          git commit -m "chore: atualiza state.json [skip ci]"
          git pull --rebase --quiet || true
          git push

      - name: Falhar o job se houve alerta (e-mail do GitHub)
        # falha SO se o script registrou (e imprimiu) >= 1 motivo de alerta
        if: steps.run.outputs.alertas != '' && steps.run.outputs.alertas != '0'
        run: |
          echo "::error title=DOG ALERTA::${{ steps.run.outputs.alertas }} alerta(s) - motivos no resumo do job e no passo Monitor"
          exit 1
